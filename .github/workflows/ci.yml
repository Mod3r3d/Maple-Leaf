name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          # Test không cần token thật; giá trị giả để tránh cảnh báo thiếu cấu hình.
          DISCORD_TOKEN: ""
          AUTOMATION_MODE: dry-run
        run: python -m unittest discover tests -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Advisory ở giai đoạn đầu: chưa chặn merge để tránh vỡ CI vì codebase cũ.
    # Khi đã dọn sạch, có thể bỏ `continue-on-error` để bắt buộc.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
